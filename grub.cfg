set timeout=0
set default=0

menuentry "Yunix" {
    multiboot /boot/seaweed.bin

    # Handed to the kernel as multiboot modules, for "install": the
    # kernel file itself, and the two pieces of GRUB an installed disk
    # boots with. The names after each path are how Seaweed finds them.
    module /boot/seaweed.bin seaweed.bin
    module /boot/grub-boot.img boot.img
    module /boot/grub-core.img core.img

    # Programs (from programs/), one module each. The Makefile writes
    # their lines here when it builds the ISO.
    # @PROGRAMS@

    boot
}
